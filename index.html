<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obscura</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root{
  --bg:    #0d0d10;
  --s1:    #121216;
  --s2:    #18181d;
  --s3:    #1f1f26;
  --s4:    #27272f;
  --s5:    #2f2f38;
  --ln:    #2e2e38;
  --ln2:   #3e3e4a;
  --dim:   #4a4a58;
  --mute:  #6c6c80;
  --soft:  #9494aa;
  --body:  #c8c8da;
  --hi:    #eeeef6;
  --acc:   #7c6ef7;
  --acc2:  #5b50c8;
  --acco:  rgba(124,110,247,.08);
  --accb:  rgba(124,110,247,.16);
  --grn:   #3fb950;
  --red:   #f85149;
  --amb:   #d29922;
  --r:     6px;
  --panel: 320px;
  --mono:  'JetBrains Mono', monospace;
  --ui:    'Inter', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--body);font-family:var(--ui);font-size:12.5px;-webkit-font-smoothing:antialiased;}

/* ─── APP ─── */
#app{display:flex;flex-direction:column;height:100vh;}

/* ─── TOPBAR ─── */
#topbar{
  flex-shrink:0;height:46px;
  background:var(--s1);border-bottom:1px solid var(--ln);
  display:flex;align-items:center;padding:0 14px;gap:8px;z-index:50;
}
.logo{
  font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.1em;color:var(--hi);flex-shrink:0;
}
.logo em{color:var(--acc);font-style:normal;}
.tsep{width:1px;height:18px;background:var(--ln);flex-shrink:0;margin:0 2px;}
.tgap{flex:1;}
/* icon buttons */
.icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:none;border:1px solid var(--ln);border-radius:var(--r);
  color:var(--mute);cursor:pointer;transition:all .12s;flex-shrink:0;font-size:14px;
}
.icon-btn:hover{color:var(--hi);border-color:var(--ln2);background:var(--s3);}
.icon-btn.active{color:var(--acc);border-color:var(--acc2);background:var(--acco);}
.icon-btn:disabled{opacity:.25;cursor:not-allowed;}
/* text buttons */
.txt-btn{
  padding:5px 12px;background:none;border:1px solid var(--ln);
  color:var(--soft);font-family:var(--ui);font-size:11.5px;font-weight:500;
  border-radius:var(--r);cursor:pointer;transition:all .12s;white-space:nowrap;
}
.txt-btn:hover{color:var(--hi);border-color:var(--ln2);background:var(--s3);}
.txt-btn:disabled{opacity:.25;cursor:not-allowed;}
/* run button */
#btn-run{
  padding:6px 18px;
  background:var(--acc);border:none;
  color:#fff;font-family:var(--ui);font-size:12px;font-weight:600;
  border-radius:var(--r);cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:opacity .12s,transform .08s;letter-spacing:.01em;
}
#btn-run:hover{opacity:.86;}
#btn-run:active{transform:scale(.96);}
.run-icon{font-size:10px;}

/* ─── WORKSPACE ─── */
#workspace{flex:1;display:flex;overflow:hidden;min-height:0;position:relative;}

/* ─── EDITORS ─── */
#editors{flex:1;display:flex;overflow:hidden;min-height:0;transition:margin-right .28s cubic-bezier(.4,0,.2,1);}
#editors.shifted{margin-right:var(--panel);}

/* vertical split */
#in-wrap,#out-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
#in-wrap{border-right:1px solid var(--ln);}

.ed-header{
  flex-shrink:0;height:36px;
  background:var(--s2);border-bottom:1px solid var(--ln);
  display:flex;align-items:center;padding:0 12px;gap:8px;
}
.ed-label{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
.ed-gap{flex:1;}
.ed-act{
  background:none;border:none;color:var(--dim);
  font-family:var(--ui);font-size:11px;cursor:pointer;
  padding:2px 7px;border-radius:4px;transition:all .1s;
}
.ed-act:hover{color:var(--body);background:var(--s3);}

/* stats strip */
#run-stats{display:none;align-items:center;gap:9px;}
.st{font-size:10px;color:var(--mute);white-space:nowrap;}
.st b{color:var(--soft);font-family:var(--mono);font-size:10px;font-weight:600;}
#out-hint{font-size:10.5px;color:var(--dim);}

.ed-body{flex:1;overflow:hidden;min-height:0;position:relative;}
.ed-body .CodeMirror,.ed-body .CodeMirror-wrap{
  height:100%;font-family:var(--mono);font-size:12.5px;line-height:1.7;
  background:var(--s1);color:var(--hi);border:none;
}
.ed-body .CodeMirror-scroll{height:100%;}
#out-wrap .ed-body .CodeMirror{background:var(--bg);}
.CodeMirror-gutters{background:rgba(0,0,0,.2)!important;border-right:1px solid var(--ln)!important;}
.CodeMirror-linenumber{color:var(--dim)!important;font-size:10.5px;padding:0 8px 0 6px!important;}
.CodeMirror-cursor{border-left:2px solid var(--acc)!important;}
.CodeMirror-selected{background:rgba(124,110,247,.14)!important;}
.CodeMirror-focused .CodeMirror-selected{background:rgba(124,110,247,.18)!important;}
.cm-keyword  {color:#bb9af7!important;font-weight:600;}
.cm-def      {color:#e0af68!important;}
.cm-variable {color:var(--hi)!important;}
.cm-variable-2{color:#7dcfff!important;}
.cm-string,.cm-string-2{color:#9ece6a!important;}
.cm-number   {color:#ff9e64!important;}
.cm-comment  {color:var(--dim)!important;font-style:italic;}
.cm-operator {color:var(--soft)!important;}
.cm-atom,.cm-builtin{color:#e0af68!important;}

/* ─── SLIDE PANEL ─── */
#panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel);
  background:var(--s1);border-left:1px solid var(--ln);
  display:flex;flex-direction:column;overflow:visible;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:40;
}
#panel-top,#panel-scroll{overflow:hidden;}
#panel-scroll{overflow-y:auto;overflow-x:hidden;}
#panel.open{transform:translateX(0);}

/* panel top */
#panel-top-wrap{
  position:relative;flex-shrink:0;
}
#panel-top{
  flex-shrink:0;height:36px;
  background:var(--s2);border-bottom:1px solid var(--ln);
  display:flex;align-items:stretch;gap:0;
  overflow-x:auto;
  scrollbar-width:none;
}
#panel-top::-webkit-scrollbar{display:none;}

/* Tab scroll hint */
#tab-scroll-hint{
  position:absolute;right:0;top:0;height:36px;
  display:flex;align-items:center;
  background:linear-gradient(to right, transparent, var(--s2) 55%);
  padding-left:20px;padding-right:6px;
  pointer-events:none;
  transition:opacity .25s;
  border-bottom:1px solid var(--ln);
}
#tab-scroll-hint.hidden{opacity:0;}
#tab-scroll-arrow{
  font-size:14px;color:var(--acc);font-weight:400;
  animation:tab-hint-pulse 2s ease-in-out infinite;
}
@keyframes tab-hint-pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.stab{
  padding:0 12px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--mute);font-family:var(--ui);font-size:10.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase;
  transition:color .12s,border-color .12s;flex-shrink:0;
}
.stab:hover{color:var(--body);}
.stab.active{color:var(--hi);border-bottom-color:var(--acc);}

/* panel scroll */
#panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;}
#panel-scroll::-webkit-scrollbar{width:3px;}
#panel-scroll::-webkit-scrollbar-thumb{background:var(--ln);border-radius:2px;}

/* tab panels */
.tpanel{display:none;padding:12px 14px 24px;}
.tpanel.active{display:block;}

/* ─── OPTION ROWS ─── */
.grp{margin-bottom:18px;}
.grp-lbl{
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;padding-bottom:5px;
  border-bottom:1px solid var(--ln);
}
.row,.sbody .row{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:6px 0;gap:10px;
}
.row+.row,.sbody .row+.row{border-top:1px solid rgba(255,255,255,.04);}
.rl{flex:1;}
.rl,label.rl{font-size:11.5px;color:var(--body);font-weight:500;line-height:1.3;cursor:default;}
.rl small{display:block;font-size:10px;color:var(--mute);margin-top:2px;line-height:1.4;font-weight:400;}

/* ─── TOGGLE ─── */
.tog{position:relative;width:30px;height:17px;flex-shrink:0;cursor:pointer;margin-top:1px;}
.tog input{display:none;}
.tk{position:absolute;inset:0;background:var(--s5);border:1px solid var(--ln2);border-radius:17px;transition:background .15s,border-color .15s;}
.tk::before{content:'';position:absolute;width:11px;height:11px;left:2px;top:2px;background:var(--mute);border-radius:50%;transition:transform .15s,background .15s;}
.tog input:checked~.tk{background:var(--acc);border-color:var(--acc2);}
.tog input:checked~.tk::before{transform:translateX(13px);background:#fff;}

/* ─── SLIDER ─── */
.sl{margin:7px 0 4px;}
.sl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.sl-name{font-size:10.5px;color:var(--soft);font-weight:500;}
.sv{font-family:var(--mono);font-size:10px;color:var(--acc);font-weight:600;}
.srow{display:flex;align-items:center;gap:6px;}
.srow input[type=range]{
  flex:1;height:3px;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  background:var(--s5);
  border-radius:2px;outline:none;
}
.srow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--acc);border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--acc);cursor:pointer;
  transition:transform .1s,box-shadow .1s;
}
.srow input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.22);box-shadow:0 0 0 4px rgba(124,110,247,.22);}
.srow input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);cursor:pointer;}
.srow input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--pct,0%),var(--s5) var(--pct,0%));}

/* ─── EDITOR SEARCH ─── */
.ed-search{
  flex-shrink:0;display:flex;flex-direction:column;
  background:var(--s2);border-bottom:1px solid var(--ln);
}
.ed-search-row{
  display:flex;align-items:center;gap:4px;padding:4px 10px;
}
.ed-replace-row{border-top:1px solid rgba(255,255,255,.04);padding-top:3px;padding-bottom:3px;}
.ed-search-inp{
  flex:1;background:var(--s3);border:1px solid var(--ln);
  color:var(--body);font-family:var(--mono);font-size:11px;
  padding:3px 7px;border-radius:var(--r);outline:none;transition:border-color .12s;
}
.ed-search-inp:focus{border-color:var(--acc2);}
.ed-search-count{font-size:10px;color:var(--mute);white-space:nowrap;min-width:52px;text-align:right;}
.ed-search-nav{
  background:none;border:1px solid var(--ln);color:var(--soft);
  font-size:10px;padding:2px 6px;border-radius:var(--r);cursor:pointer;transition:all .1s;white-space:nowrap;
}
.ed-search-nav:hover{color:var(--hi);border-color:var(--ln2);background:var(--s3);}
.ed-replace-btn{font-size:10px;padding:2px 8px;}
.ed-search-close{
  background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;
  padding:0 2px;transition:color .1s;line-height:1;flex-shrink:0;
}
.ed-search-close:hover{color:var(--red);}
.ed-search-highlight{background:rgba(255,210,60,.22)!important;border-radius:2px;}
.ed-search-current{background:rgba(255,140,0,.48)!important;border-radius:2px;outline:1px solid rgba(255,140,0,.7);}

.fld{margin-top:7px;}
.fld-lbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:3px;}
.fi,.fsel{
  width:100%;background:var(--s3);border:1px solid var(--ln);
  color:var(--body);font-family:var(--mono);font-size:11px;
  padding:5px 8px;border-radius:var(--r);outline:none;transition:border-color .12s;
}
.fi:focus,.fsel:focus{border-color:var(--acc2);}
.fsel{font-family:var(--ui);font-size:11.5px;cursor:pointer;}
.seed-row{display:flex;gap:4px;margin-top:4px;}
.seed-row .fi{flex:1;}
.btn-rng{
  padding:5px 9px;background:var(--s3);border:1px solid var(--ln);
  color:var(--soft);font-size:14px;border-radius:var(--r);cursor:pointer;
  transition:all .1s;flex-shrink:0;
}
.btn-rng:hover{color:var(--hi);border-color:var(--ln2);}

/* ─── NOTICES ─── */
.warn-box{margin-top:6px;padding:6px 9px;background:rgba(210,153,34,.07);border:1px solid rgba(210,153,34,.22);border-radius:var(--r);font-size:10.5px;color:var(--amb);line-height:1.5;}
.info-box{margin-top:6px;padding:6px 9px;background:rgba(124,110,247,.07);border:1px solid rgba(124,110,247,.2);border-radius:var(--r);font-size:10.5px;color:#9b91f8;line-height:1.5;}

/* ─── PANEL PULL TAB ─── */
#panel-pull{
  position:absolute;
  right:0; top:50%; transform:translateY(-50%);
  width:24px; height:80px;
  background:var(--s2);
  border:1px solid var(--ln); border-right:none;
  border-radius:8px 0 0 8px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--mute);
  transition:background .15s,color .15s,right .28s cubic-bezier(.4,0,.2,1);
  box-shadow:-3px 0 10px rgba(0,0,0,.35);
  z-index:45;
}
#panel-pull:hover{background:var(--s3);color:var(--hi);}
#pull-arrow{
  font-size:12px;line-height:1;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:block;
}
#panel-pull[data-open='true'] #pull-arrow{transform:rotate(180deg);}
#pull-label{
  font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;writing-mode:vertical-rl;
  color:inherit;line-height:1;opacity:.7;
}
#panel-pull:hover #pull-label{opacity:1;}

/* ─── SCROLL HINT ─── */
#scroll-hint{
  position:absolute;bottom:0;left:0;right:0;
  height:48px;
  background:linear-gradient(to bottom,transparent,var(--s1) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:8px;gap:2px;pointer-events:none;
  opacity:1;transition:opacity .4s;
}
.scroll-hint-text{
  font-size:9.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);
  animation:hint-pulse 2.2s ease-in-out infinite;
}
.scroll-hint-arrow{
  font-size:13px;color:var(--acc);opacity:.8;
  animation:hint-bounce 2.2s ease-in-out infinite;
}
@keyframes hint-pulse{0%,100%{opacity:.4;}50%{opacity:.9;}}
@keyframes hint-bounce{
  0%,100%{opacity:.5;transform:translateY(0);}
  50%{opacity:1;transform:translateY(3px);}
}

/* ─── STATUS BAR ─── */
#statusbar{
  flex-shrink:0;height:26px;
  background:var(--s1);border-top:1px solid var(--ln);
  display:flex;align-items:center;padding:0 14px;gap:8px;
}
.sb-logo{
  font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--dim);letter-spacing:.08em;
}
.sb-logo em{color:var(--acc);font-style:normal;}
.sb-sep{width:1px;height:12px;background:var(--ln);flex-shrink:0;}
.sb-item{font-size:10px;color:var(--dim);white-space:nowrap;}
.sb-gap{flex:1;}

#input-preset option{background:var(--s3);color:var(--body);}
</style>
</head>
<body>
<div id="app">

<!-- ══════════ TOPBAR ══════════ -->
<div id="topbar">
  <div class="logo">Obs<em>cu</em>ra</div>
  <div class="tgap"></div>
  <button class="txt-btn" id="btn-copy" onclick="copyOut()">Copy</button>
  <button class="txt-btn" id="btn-map" onclick="dlMap()" disabled>Map</button>
  <div class="tsep"></div>
  <button id="btn-run" onclick="runObfuscate()">
    <span class="run-icon">▶</span> Run
  </button>
</div>

<!-- ══════════ WORKSPACE ══════════ -->
<div id="workspace">
  <button id="panel-pull" onclick="togglePanel()" title="Toggle settings panel">
    <span id="pull-arrow">❮</span>
    <span id="pull-label">Settings</span>
  </button>

  <!-- editors -->
  <div id="editors">

    <div id="in-wrap">
      <div class="ed-header">
        <span class="ed-label">Input</span>
        <span class="ed-gap"></span>
        <select id="input-preset" class="ed-act" style="font-family:var(--ui);font-size:11px;background:var(--s3);border:1px solid var(--ln);color:var(--body);cursor:pointer;padding:2px 6px;border-radius:4px;outline:none;" onchange="applyInputPreset(this.value)" title="Load a sample">
          <option value="">Samples…</option>
          <option value="hello">Hello World</option>
          <option value="class">ES6 Class</option>
          <option value="crypto">Crypto Util</option>
          <option value="api">API Fetch</option>
          <option value="license">License Check</option>
          <option value="antidbg">Anti-Debug Target</option>
        </select>
        <button class="ed-act" onclick="beautifyInput()" title="Beautify / format code">Beautify</button>
        <button class="ed-act" onclick="clearInput()">Clear</button>
      </div>
      <!-- Search + Replace bar (input only) -->
      <div class="ed-search" id="search-in" style="display:none">
        <div class="ed-search-row">
          <input class="ed-search-inp" id="search-in-inp" type="text" placeholder="Find…" oninput="doSearch('in')" onkeydown="searchKey(event,'in')">
          <span class="ed-search-count" id="search-in-count"></span>
          <button class="ed-search-nav" onclick="searchNav('in',-1)" title="Previous (Shift+Enter)">▲</button>
          <button class="ed-search-nav" onclick="searchNav('in',1)" title="Next (Enter)">▼</button>
          <button class="ed-search-close" onclick="toggleSearch('in')" title="Close (Esc)">✕</button>
        </div>
        <div class="ed-search-row ed-replace-row">
          <input class="ed-search-inp" id="replace-in-inp" type="text" placeholder="Replace with…" onkeydown="replaceKey(event)">
          <button class="ed-search-nav ed-replace-btn" onclick="replaceOne()" title="Replace current match">Replace</button>
          <button class="ed-search-nav ed-replace-btn" onclick="replaceAll()" title="Replace all matches">All</button>
        </div>
      </div>
      <div class="ed-body" id="in-editor"></div>
    </div>

    <div id="out-wrap">
      <div class="ed-header">
        <span class="ed-label">Output</span>
        <span class="ed-gap"></span>
        <div id="run-stats">
          <span class="st">In <b id="s-in">—</b></span>
          <span class="st">→ <b id="s-out">—</b></span>
          <span class="st">×<b id="s-ratio">—</b></span>
          <span class="st"><b id="s-time">—</b></span>
        </div>
        <span id="out-hint">Run to see output</span>
      </div>
      <!-- Search-only bar (output) -->
      <div class="ed-search" id="search-out" style="display:none">
        <div class="ed-search-row">
          <input class="ed-search-inp" id="search-out-inp" type="text" placeholder="Find…" oninput="doSearch('out')" onkeydown="searchKey(event,'out')">
          <span class="ed-search-count" id="search-out-count"></span>
          <button class="ed-search-nav" onclick="searchNav('out',-1)" title="Previous (Shift+Enter)">▲</button>
          <button class="ed-search-nav" onclick="searchNav('out',1)" title="Next (Enter)">▼</button>
          <button class="ed-search-close" onclick="toggleSearch('out')" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="ed-body" id="out-editor"></div>
    </div>

  </div>

  <!-- ══════════ SLIDE PANEL ══════════ -->
  <div id="panel">
    <div id="panel-top-wrap">
      <div id="panel-top">
        <button class="stab active" data-tab="output" onclick="switchTab('output')">Output</button>
      </div>
      <div id="tab-scroll-hint">
        <span id="tab-scroll-arrow">›</span>
      </div>
    </div><!-- end panel-top-wrap -->

    <div id="panel-scroll">

      <!-- OUTPUT TAB -->
      <div class="tpanel active" id="tpanel-output">
        <div class="grp">
          <div class="grp-lbl">Minification</div>
          <div class="fld" style="margin-bottom:6px;">
            <div class="fld-lbl">Strict Mode</div>
            <select class="fsel" id="o_strict_mode">
              <option value="always">'use strict' — always prepend</option>
              <option value="auto" selected>Auto — only if source has it</option>

/* ─── PANEL TOGGLE ─── */
let panelOpen = false;
function togglePanel(){
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('open', panelOpen);
  document.getElementById('editors').classList.toggle('shifted', panelOpen);
  const pull = document.getElementById('panel-pull');
  if(pull){pull.style.right = panelOpen ? 'var(--panel)' : '0';pull.dataset.open=panelOpen;}
  if(panelOpen&&window._updateTabHint)setTimeout(window._updateTabHint,30);
  setTimeout(fitEditors, 30);
}

// Scroll hints
(function(){
  const sc=()=>document.getElementById('panel-scroll');
  const hint=()=>document.getElementById('scroll-hint');
  const tabs=()=>document.getElementById('panel-top');
  const tabHint=()=>document.getElementById('tab-scroll-hint');

  function updateBottomHint(){
    const s=sc(),h=hint();
    if(!s||!h)return;
    const canScroll=s.scrollHeight>s.clientHeight+10;
    const atBottom=s.scrollHeight-s.scrollTop-s.clientHeight<40;
    h.style.opacity=(canScroll&&!atBottom)?'1':'0';
  }

  function updateTabHint(){
    const t=tabs(),th=tabHint();
    if(!t||!th)return;
    const atEnd=t.scrollWidth-t.scrollLeft-t.clientWidth<8;
    th.classList.toggle('hidden',atEnd);
  }

  window._onTabSwitch=function(){
    const s=sc();
    if(s)s.scrollTop=0;
    requestAnimationFrame(()=>{updateBottomHint();});
  };

  window.addEventListener('load',()=>{
    const s=sc();
    if(s){s.addEventListener('scroll',updateBottomHint);updateBottomHint();}
    const t=tabs();
    if(t){t.addEventListener('scroll',updateTabHint);updateTabHint();}
  });

  window._updateTabHint=updateTabHint;
})();

// ================================================================
//  MINIFICATION PIPELINE
// ================================================================

// Helper: safely skip regex literals when scanning code character by character
function _trySkipRegex(code,i,prevCh){
  if(code[i]!=='/')return -1;
  if(code[i+1]==='/'||code[i+1]==='*')return -1;
  if(prevCh!==''&&!/[=+\-*%&|^!<>?,;:([\{~]/.test(prevCh))return -1;
  let pos=i+1,inCls=false;
  while(pos<code.length){
    const c=code[pos];
    if(c==='\n'||c==='\r')return -1;
    if(c==='\\'&&pos+1<code.length){pos+=2;continue;}
    if(c==='['&&!inCls){inCls=true;pos++;continue;}
    if(c===']'&&inCls){inCls=false;pos++;continue;}
    if(c==='/'&&!inCls){pos++;while(pos<code.length&&/[gimsuy]/.test(code[pos]))pos++;return pos;}
    pos++;
  }
  return -1;
}

// Strip comments while preserving string/template/regex literals
function _stripComments(code){
  let r='',i=0,n=code.length;
  while(i<n){
    const ch=code[i];
    if(ch==='"'||ch==="'"){
      const q=ch;r+=ch;i++;
      while(i<n){const c=code[i];r+=c;i++;if(c==='\\'){r+=code[i]||'';i++;}else if(c===q)break;}
      continue;
    }
    if(ch==='`'){
      r+=ch;i++;
      let depth=0;
      while(i<n){
        const c=code[i];
        if(c==='\\'){r+=c+(code[i+1]||'');i+=2;continue;}
        if(c==='$'&&code[i+1]==='{'){r+=c+'{';i+=2;depth++;continue;}
        if(c==='}'&&depth>0){r+=c;i++;depth--;continue;}
        r+=c;i++;
        if(c==='`'&&depth===0)break;
      }
      continue;
    }
    if(ch==='/'&&code[i+1]==='/'){while(i<n&&code[i]!=='\n')i++;continue;}
    if(ch==='/'&&code[i+1]==='*'){
      i+=2;
      while(i<n&&!(code[i]==='*'&&code[i+1]=='/'))i++;
      i+=2;
      continue;
    }
    r+=ch;i++;
  }
  return r;
}

// Minify: strip comments, collapse whitespace, fix keyword spacing
function minify(code,opts){
  code=_stripComments(code);
  function _kwFix(src){
    const KWS=new Set(['return','typeof','instanceof','in','of','new','delete','void','throw',
      'case','var','let','const','function','class','extends','else','if','do','while','for',
      'switch','try','catch','finally','async','await','yield','export','import']);
    const NOKW_AFTER=new Set([' ','\n','\r','\t','{','(','[',';',',']);
    let out='',i=0,n=src.length;
    while(i<n){
      const ch=src[i];
      if(ch==='"'||ch==="'"){
        const q=ch;out+=ch;i++;
        while(i<n){const c=src[i];out+=c;i++;if(c==='\\'){out+=src[i]||'';i++;}else if(c===q)break;}
        continue;
      }
      if(ch==='`'){
        out+=ch;i++;let d=0;
        while(i<n){const c=src[i];if(c==='\\'){out+=c+(src[i+1]||'');i+=2;continue;}
          if(c==='$'&&src[i+1]==='{'){out+='${';i+=2;d++;continue;}
          if(c==='}'&&d>0){out+=c;i++;d--;continue;}
          out+=c;i++;if(c==='`'&&d===0)break;}
        continue;
      }
      if(/[a-zA-Z_$]/.test(ch)){
        let j=i;while(j<n&&/[a-zA-Z0-9_$]/.test(src[j]))j++;
        const word=src.slice(i,j);
        if(KWS.has(word)&&j<n&&!NOKW_AFTER.has(src[j])){
          out+=word+' ';i=j;continue;
        }
        out+=word;i=j;continue;
      }
      out+=ch;i++;
    }
    return out;
  }
  code=code.replace(/[ \t\r\n]+/g,' ');
  code=code.replace(/ ?([\{\}\[\]\(\);,]) ?/g,'$1');
  code=code.replace(/([\)\]\}0-9_$a-zA-Z]) ([\+\-\*\/\=\<\>\!\&\|\^\~\%\?:])/g,'$1$2');
  code=code.replace(/([\+\-\*\/\=\<\>\!\&\|\^\~\%\?:]) ([\(\[\{0-9_$a-zA-Z])/g,'$1$2');
  code=_kwFix(code);
  if(opts.semi){
    let prev;
    do{
      prev=code;
      code=code.replace(/\bvar ([^{}\[\]();]{1,200});\s*var /g,'var $1,');
    }while(code!==prev);
  }
  return code.trim();
}

// Final compact pass: token-aware whitespace collapse
function _compactCode(code){
  let out='',i=0,n=code.length;
  let prevNonSpace='';
  while(i<n){
    const ch=code[i];
    if(ch==='"'||ch==="'"){
      const q=ch;out+=ch;prevNonSpace=ch;i++;
      while(i<n){const c=code[i];out+=c;i++;
        if(c==='\\'){out+=code[i]||'';i++;}
        else if(c===q){prevNonSpace=c;break;}
      }continue;
    }
    if(ch==='`'){
      out+=ch;prevNonSpace=ch;i++;let d=0;
      while(i<n){const c=code[i];
        if(c==='\\'){out+=c+(code[i+1]||'');i+=2;continue;}
        if(c==='$'&&code[i+1]==='{'){out+='${';i+=2;d++;continue;}
        if(c==='}'&&d>0){out+=c;i++;d--;continue;}
        out+=c;i++;prevNonSpace=c;
        if(c==='`'&&d===0)break;
      }continue;
    }
    if(ch==='/'){
      const end=_trySkipRegex(code,i,prevNonSpace);
      if(end>i){
        const rx=code.slice(i,end);out+=rx;
        prevNonSpace=rx[rx.length-1];i=end;
        if(i<n&&/[a-zA-Z_$0-9]/.test(code[i])){out+=' ';}
        continue;
      }
    }
    if(ch===' '||ch==='\t'||ch==='\r'||ch==='\n'){
      let j=i;while(j<n&&(code[j]===' '||code[j]==='\t'||code[j]==='\r'||code[j]==='\n'))j++;
      const nextCh=code[j]||'';
      const needSpace=/[a-zA-Z0-9_$]/.test(prevNonSpace)&&/[a-zA-Z0-9_$]/.test(nextCh);
      if(needSpace)out+=' ';
      i=j;continue;
    }
    out+=ch;prevNonSpace=ch;i++;
  }
  return out;
}

// Extract UserScript header
function extractTmHeader(src){
  const m=/^(\/\/\s*==UserScript==[\s\S]*?\/\/\s*==\/UserScript==\n?)/.exec(src);
  return m?{header:m[1],rest:src.slice(m[1].length)}:{header:'',rest:src};
}

// Pass: separate out import/export/require lines
function passIgnoreImports(src){
  const lines=src.split('\n'),imp=[],rest=[];
  for(const l of lines){
    if(/^\s*(import[\s{*]|export\s+(default\s+)?|(const|var|let)\s+[\w{*]\w*\s*=\s*require\()/.test(l))imp.push(l);
    else rest.push(l);
  }
  return{importLines:imp,rest:rest.join('\n')};
}

// Pass: process <script> blocks in HTML
function passHtmlParse(html,processFn){
  return html.replace(/<script([^>]*)>([\s\S]*?)<\/script>/gi,(m,attrs,src)=>{
    if(attrs.includes('src=')||!src.trim())return m;
    try{return '<script'+attrs+'>'+processFn(src)+'<\/script>';}catch(e){return m;}
  });
}

// Source map builder
let _lastMap=null;
function buildSourceMap(orig){
  return JSON.stringify({version:3,file:VAL('o_smap_url')||'output.js',sourceRoot:VAL('o_smap_root')||'',sources:['input.js'],sourcesContent:[orig],names:[],mappings:'AAAA'},null,2);
}

// ================================================================
//  MAIN PIPELINE
// ================================================================
function getOpts(){
  return{
    html:        CHK('o_html'),
    strict_mode: VAL('o_strict_mode')||'auto',
    mini:        CHK('o_mini'),
    semi:        CHK('o_semi'),
    ignimport:   CHK('o_ignimport'),
    srcmap:      CHK('o_srcmap'),
  };
}

function obfuscate(src,opts){
  if(opts.html){
    return{code:passHtmlParse(src,s=>obfuscate(s,{...opts,html:false}).code)};
  }
  const _tmExtract=extractTmHeader(src);
  const _tmHdr=_tmExtract.header;
  if(_tmHdr)src=_tmExtract.rest;
  let importLines=[],workSrc=src;
  if(opts.ignimport){const r=passIgnoreImports(src);importLines=r.importLines;workSrc=r.rest;}
  let code=workSrc;
  const _sm=opts.strict_mode||'auto';
  if(_sm==='always'){code="'use strict';"+code;}
  else if(_sm==='auto'){if(/['"]use strict['"]/.test(src))code="'use strict';"+code;}
  else if(_sm==='never'){code=code.replace(/^['"]use strict['"];?\n?/,'');}
  if(opts.mini){
    code=minify(code,opts);
    code=_compactCode(code);
  }
  if(importLines.length)code=importLines.join('\n')+'\n'+code;
  if(_tmHdr)code=_tmHdr+code;
  return{code};
}

function runObfuscate(){
  const src=inputEditor.getValue();
  if(!src.trim()){alert('Paste some JavaScript first.');return;}
  const opts=getOpts();
  const t0=performance.now();
  try{
    const{code}=obfuscate(src,opts);
    let out=code;
    if(opts.srcmap){
      _lastMap=buildSourceMap(src);
      out=code+'\n//# sourceMappingURL='+(VAL('o_smap_url')||'output.js.map');
      G('btn-map').disabled=false;
    }else{
      _lastMap=null;G('btn-map').disabled=true;
    }
    outputEditor.setValue(out);
    outputEditor.refresh();
    const elapsed=((performance.now()-t0)/1000).toFixed(2)+'s';
    SETD('s-in',src.length.toLocaleString()+' B');
    SETD('s-out',out.length.toLocaleString()+' B');
    SETD('s-ratio',(out.length/src.length).toFixed(1)+'×');
    SETD('s-time',elapsed);
    showRunStats();
  }catch(e){
    outputEditor.setValue('// ERROR: '+e.message+'\n//\n// '+(e.stack||''));
    outputEditor.refresh();
    const rs=G('run-stats'),oh=G('out-hint');
    if(rs)rs.style.display='none';
    if(oh){oh.style.display='';oh.textContent='Error';}
    _lastMap=null;G('btn-map').disabled=true;
  }
}

// ================================================================
//  JS BEAUTIFIER
// ================================================================
function _jsBeautify(src){
  const tokens=[];
  let i=0,n=src.length;

  const REGEX_KW=new Set(['return','typeof','void','delete','new','throw','case',
    'else','in','of','instanceof','do','await','yield','import','export','from']);
  function lastMeaningfulType(){
    for(let k=tokens.length-1;k>=0;k--){
      const t=tokens[k];
      if(t.type==='ws'||t.type==='line_comment'||t.type==='block_comment')continue;
      return t;
    }
    return null;
  }
  function canBeRegex(){
    const lm=lastMeaningfulType();
    if(!lm)return true;
    if(lm.type==='punct'){
      return lm.val!==')'&&lm.val!==']'&&lm.val!=='++'&&lm.val!=='--';
    }
    if(lm.type==='word') return REGEX_KW.has(lm.val);
    return false;
  }

  while(i<n){
    const ch=src[i];
    if(ch===' '||ch==='\t'||ch==='\r'||ch==='\n'){
      let s='';while(i<n&&(src[i]===' '||src[i]==='\t'||src[i]==='\r'||src[i]==='\n'))s+=src[i++];
      tokens.push({type:'ws',val:s});continue;
    }
    if(ch==='/'&&src[i+1]==='/'){
      let s='';while(i<n&&src[i]!=='\n')s+=src[i++];
      tokens.push({type:'line_comment',val:s});continue;
    }
    if(ch==='/'&&src[i+1]==='*'){
      let s='/*';i+=2;
      while(i<n&&!(src[i]==='*'&&src[i+1]==='/')){s+=src[i++];}
      s+='*/';i+=2;
      tokens.push({type:'block_comment',val:s});continue;
    }
    if(ch==='"'||ch==="'"){
      const q=ch;let s=ch;i++;
      while(i<n){const c=src[i];s+=c;i++;if(c==='\\'){s+=src[i]||'';i++;}else if(c===q)break;}
      tokens.push({type:'string',val:s});continue;
    }
    if(ch==='`'){
      let s='`';i++;let d=0;
      while(i<n){
        const c=src[i];
        if(c==='\\'){s+=c+(src[i+1]||'');i+=2;continue;}
        if(c==='$'&&src[i+1]==='{'){s+='${';i+=2;d++;continue;}
        if(c==='}'&&d>0){s+=c;i++;d--;continue;}
        s+=c;i++;if(c==='`'&&d===0)break;
      }
      tokens.push({type:'template',val:s});continue;
    }
    if(ch==='/'&&canBeRegex()){
      let s='/';i++;let inCls=false;
      let valid=false;
      while(i<n){
        const c=src[i];
        if(c==='\n'||c==='\r')break;
        if(c==='\\'&&i+1<n){s+=c+src[i+1];i+=2;continue;}
        if(c==='['&&!inCls){inCls=true;s+=c;i++;continue;}
        if(c===']'&&inCls){inCls=false;s+=c;i++;continue;}
        if(c==='/'&&!inCls){
          s+=c;i++;
          while(i<n&&/[gimsuyv]/.test(src[i]))s+=src[i++];
          valid=true;break;
        }
        s+=c;i++;
      }
      if(valid){tokens.push({type:'regex',val:s});continue;}
      tokens.push({type:'punct',val:'/'});i=i-(s.length-1);continue;
    }
    const two=src.slice(i,i+3);
    const m3=['===','!==','>>>','**=','||=','&&=','??=','...'];
    const m2=['=>','**','++','--','+=','-=','*=','/=','%=','&=','|=','^=',
               '<=','>=','==','!=','&&','||','??','<<','>>','?.'];
    if(m3.some(p=>two.startsWith(p))){const p=m3.find(p=>two.startsWith(p));tokens.push({type:'punct',val:p});i+=p.length;continue;}
    if(m2.some(p=>two.startsWith(p))){const p=m2.find(p=>two.startsWith(p));tokens.push({type:'punct',val:p});i+=p.length;continue;}
    if(/[a-zA-Z_$0-9]/.test(ch)){
      let s='';while(i<n&&/[a-zA-Z_$0-9]/.test(src[i]))s+=src[i++];
      tokens.push({type:/^[0-9]/.test(s)?'number':'word',val:s});continue;
    }
    tokens.push({type:'punct',val:ch});i++;
  }

  const INDENT='  ';
  let out='';
  let depth=0;
  let col=0;

  function ind(){ return INDENT.repeat(Math.max(0,depth)); }
  function lastChar(){ return out[out.length-1]||''; }
  function trimTrailingSpace(){ out=out.replace(/[ \t]+$/,''); }
  function newline(extra){ trimTrailingSpace();out+='\n'+(extra||'');col=0; }
  function nlIndent(d){ newline();out+=INDENT.repeat(Math.max(0,d!==undefined?d:depth)); }
  function space(){ if(lastChar()!==' ')out+=' '; }
  function emitToken(v){ out+=v;col+=v.length; }

  const meaningful=tokens.filter(t=>t.type!=='ws'&&t.type!=='line_comment'&&t.type!=='block_comment');
  let mi=0;
  let prev=null;
  let freshLine=false;
  const stack=[];

  while(mi<meaningful.length){
    const tok=meaningful[mi];
    const nxt=meaningful[mi+1]||null;
    const {type,val}=tok;

    if(type==='line_comment'||type==='block_comment'){
      if(!freshLine){nlIndent();}
      emitToken(val);
      nlIndent();freshLine=true;
      mi++;prev=tok;continue;
    }

    if(type==='string'||type==='template'||type==='regex'||type==='number'){
      if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
      emitToken(val);freshLine=false;
      mi++;prev=tok;continue;
    }

    if(type==='word'){
      if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
      emitToken(val);freshLine=false;
      mi++;prev=tok;continue;
    }

    if(type==='punct'){
      if(val==='{'){
        if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
        emitToken('{');
        stack.push('{');depth++;
        nlIndent();freshLine=true;
        mi++;prev=tok;continue;
      }
      if(val==='}'){
        depth=Math.max(0,depth-1);
        stack.pop();
        if(!freshLine)nlIndent(depth);
        emitToken('}');
        freshLine=false;
        if(nxt&&nxt.val!==';'&&nxt.val!==','&&nxt.val!==')'&&nxt.val!==']'&&nxt.val!=='.'){
          nlIndent();freshLine=true;
        }
        mi++;prev=tok;continue;
      }
      if(val==='('){
        if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
        emitToken('(');stack.push('(');
        freshLine=false;
        mi++;prev=tok;continue;
      }
      if(val===')'){
        stack.pop();
        emitToken(')');freshLine=false;
        mi++;prev=tok;continue;
      }
      if(val==='['){
        if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
        emitToken('[');stack.push('[');freshLine=false;
        mi++;prev=tok;continue;
      }
      if(val===']'){
        stack.pop();emitToken(']');freshLine=false;
        mi++;prev=tok;continue;
      }
      if(val===';'){
        emitToken(';');
        const inParen=stack.length>0&&stack[stack.length-1]==='(';
        if(!inParen){
          if(nxt&&nxt.val!=='}'){nlIndent();freshLine=true;}
        }
        mi++;prev=tok;continue;
      }
      if(val===','){
        emitToken(',');
        const inBrace=stack.length>0&&stack[stack.length-1]==='{';
        if(inBrace){nlIndent();freshLine=true;}else{space();}
        mi++;prev=tok;continue;
      }
      if(val===':'){
        const prevMeaningful2=meaningful[mi-2];
        const isTernary=prevMeaningful2&&prevMeaningful2.val==='?';
        if(!isTernary){
          emitToken(':');
          const inBlock=stack.length>0&&stack[stack.length-1]==='{';
          if(inBlock&&prev&&prev.type!=='string'&&prev.type!=='number'){
            nlIndent();freshLine=true;
          }else{space();}
        }else{space();emitToken(':');space();}
        mi++;prev=tok;continue;
      }
      if(val==='?'){space();emitToken('?');space();mi++;prev=tok;continue;}
      if(val==='=>'){space();emitToken('=>');space();mi++;prev=tok;continue;}
      const SPACED_OPS=new Set([
        '=','+=','-=','*=','/=','%=','**=','&=','|=','^=','<<=','>>=','>>>=',
        '||=','&&=','??=','==','!=','===','!==','<','<=','>','>=',
        '&&','||','??','&','|','^','<<','>>','>>>','+','-','*','/','%','**',
        'in','instanceof',
      ]);
      const unaryContext=prev&&(
        prev.type==='punct'&&(prev.val==='('||prev.val==='['||prev.val===','||
          prev.val==='='||prev.val==='+'||prev.val==='-'||prev.val==='*'||
          prev.val==='/'||prev.val==='%'||prev.val==='!'||prev.val==='~'||
          prev.val==='=>'||prev.val===':'||prev.val==='{'||prev.val===';'||
          prev.val==='return'||prev.val==='&&'||prev.val==='||'||prev.val==='??'
        )||
        prev.type==='word'&&(prev.val==='return'||prev.val==='typeof'||
          prev.val==='void'||prev.val==='delete'||prev.val==='new'||
          prev.val==='throw'||prev.val==='case'||prev.val==='in'||prev.val==='of')
      );
      if(SPACED_OPS.has(val)&&!(unaryContext&&(val==='-'||val==='+'))){
        if(!freshLine)space();
        emitToken(val);space();
        mi++;prev=tok;continue;
      }
      if(val==='.'||val==='?.'){emitToken(val);mi++;prev=tok;continue;}
      if(val==='...'||val==='!'||val==='~'){
        if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
        emitToken(val);mi++;prev=tok;continue;
      }
      if(!freshLine&&prev&&needSpaceBetween(prev,tok))space();
      emitToken(val);mi++;prev=tok;continue;
    }

    emitToken(val);mi++;prev=tok;
  }

  function needSpaceBetween(a,b){
    if(!a||!b)return false;
    const aWord=a.type==='word'||a.type==='number';
    const bWord=b.type==='word'||b.type==='number';
    if(aWord&&bWord)return true;
    const KW_SPACE=new Set(['if','for','while','switch','catch','with','return',
      'typeof','void','delete','throw','new','case','in','of','await','yield']);
    if(aWord&&b.val==='(')return KW_SPACE.has(a.val);
    if(a.val===')'&&b.val==='{')return true;
    if(aWord&&b.val==='{')return true;
    return false;
  }

  return out.trim();
}

// ================================================================
//  SEARCH / REPLACE
// ================================================================
const _searchState={in:{matches:[],cur:-1,marks:[]},out:{matches:[],cur:-1,marks:[]}};
let _lastFocusedSide='in';

function _getEditor(side){return side==='in'?inputEditor:outputEditor;}

function toggleSearch(side){
  const bar=G('search-'+side);
  const visible=bar.style.display!=='none';
  if(visible){
    bar.style.display='none';
    _clearSearchMarks(side);
    _searchState[side].matches=[];
    _searchState[side].cur=-1;
    G('search-'+side+'-count').textContent='';
    _getEditor(side).focus();
  }else{
    bar.style.display='flex';
    const inp=G('search-'+side+'-inp');
    const ed=_getEditor(side);
    const sel=ed.getSelection();
    if(sel&&sel.length<200){inp.value=sel;}
    inp.focus();inp.select();
    doSearch(side);
  }
  setTimeout(fitEditors,30);
}

function _clearSearchMarks(side){
  _searchState[side].marks.forEach(m=>{try{m.clear();}catch(_){}});
  _searchState[side].marks=[];
}

function doSearch(side){
  const query=G('search-'+side+'-inp').value;
  _clearSearchMarks(side);
  const st=_searchState[side];
  st.matches=[];st.cur=-1;
  const countEl=G('search-'+side+'-count');
  if(!query){countEl.textContent='';return;}
  const ed=_getEditor(side);
  const doc=ed.getDoc();
  const content=doc.getValue();
  const lower=content.toLowerCase();
  const ql=query.toLowerCase();
  let pos=0;
  while(pos<content.length){
    const idx=lower.indexOf(ql,pos);
    if(idx<0)break;
    st.matches.push(idx);
    pos=idx+1;
  }
  if(!st.matches.length){countEl.textContent='No results';return;}
  st.marks=st.matches.map(idx=>{
    const from=doc.posFromIndex(idx);
    const to=doc.posFromIndex(idx+query.length);
    return doc.markText(from,to,{className:'ed-search-highlight'});
  });
  countEl.textContent=`1 / ${st.matches.length}`;
  st.cur=0;
  _jumpToMatch(side,0,true);
}

function _jumpToMatch(side,idx,initial){
  const ed=_getEditor(side);
  const st=_searchState[side];
  if(!st.matches.length)return;
  idx=((idx%st.matches.length)+st.matches.length)%st.matches.length;
  st.cur=idx;
  _clearSearchMarks(side);
  const doc=ed.getDoc();
  const query=G('search-'+side+'-inp').value;
  st.marks=st.matches.map((mIdx,mi)=>{
    const from=doc.posFromIndex(mIdx);
    const to=doc.posFromIndex(mIdx+query.length);
    return doc.markText(from,to,{className:mi===idx?'ed-search-current':'ed-search-highlight'});
  });
  G('search-'+side+'-count').textContent=`${idx+1} / ${st.matches.length}`;
  const curIdx=st.matches[idx];
  const from=doc.posFromIndex(curIdx);
  ed.scrollIntoView({line:from.line,ch:from.ch},100);
  if(!initial)ed.setCursor(from);
}

function searchNav(side,dir){
  const st=_searchState[side];
  if(!st.matches.length)return;
  _jumpToMatch(side,st.cur+dir);
}

function searchKey(e,side){
  if(e.key==='Enter'){e.preventDefault();searchNav(side,e.shiftKey?-1:1);}
  if(e.key==='Escape'){e.preventDefault();toggleSearch(side);}
}

function replaceKey(e){
  if(e.key==='Enter'){e.preventDefault();e.shiftKey?replaceAll():replaceOne();}
  if(e.key==='Escape'){e.preventDefault();toggleSearch('in');}
}

function replaceOne(){
  const st=_searchState['in'];
  if(!st.matches.length)return;
  const cur=st.cur<0?0:st.cur;
  const query=G('search-in-inp').value;
  const replacement=G('replace-in-inp').value;
  if(!query)return;
  const doc=inputEditor.getDoc();
  const mIdx=st.matches[cur];
  const from=doc.posFromIndex(mIdx);
  const to=doc.posFromIndex(mIdx+query.length);
  doc.replaceRange(replacement,from,to);
  doSearch('in');
  if(st.matches.length>0)_jumpToMatch('in',Math.min(cur,st.matches.length-1));
}

function replaceAll(){
  const query=G('search-in-inp').value;
  const replacement=G('replace-in-inp').value;
  if(!query)return;
  const content=inputEditor.getValue();
  const lower=content.toLowerCase();
  const ql=query.toLowerCase();
  let result='',pos=0,count=0;
  while(pos<content.length){
    const idx=lower.indexOf(ql,pos);
    if(idx<0){result+=content.slice(pos);break;}
    result+=content.slice(pos,idx)+replacement;
    pos=idx+query.length;count++;
  }
  if(count===0)return;
  inputEditor.setValue(result);
  _clearSearchMarks('in');
  _searchState['in'].matches=[];_searchState['in'].cur=-1;
  G('search-in-count').textContent=`Replaced ${count}`;
  setTimeout(()=>{const c=G('search-in-count');if(c&&c.textContent.startsWith('Replaced'))c.textContent='';doSearch('in');},1800);
}

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){
    e.preventDefault();
    let side=_lastFocusedSide||'in';
    const bar=G('search-'+side);
    if(bar.style.display==='none'){toggleSearch(side);}
    else{G('search-'+side+'-inp').focus();G('search-'+side+'-inp').select();}
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='h'){
    e.preventDefault();
    if(G('search-in').style.display==='none')toggleSearch('in');
    setTimeout(()=>{const r=G('replace-in-inp');if(r)r.focus();},60);
  }
});

// ================================================================
//  CodeMirror Init
// ================================================================
const inputEditor=CodeMirror(G('in-editor'),{
  mode:'javascript',lineNumbers:true,foldGutter:true,
  gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
  extraKeys:{'Ctrl-Q':cm=>cm.foldCode(cm.getCursor()),'Cmd-Q':cm=>cm.foldCode(cm.getCursor())},
  matchBrackets:true,autoCloseBrackets:true,lineWrapping:false,tabSize:2,indentWithTabs:false,
  value:'// Paste your JavaScript here\n\nfunction greet(name) {\n  console.log(\'Hello, \' + name + \'!\');\n  return name.length;\n}\n\ngreet(\'world\');',
});
const outputEditor=CodeMirror(G('out-editor'),{
  mode:'javascript',lineNumbers:true,foldGutter:true,
  gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'],
  readOnly:true,lineWrapping:false,tabSize:2,value:'',
});

(function(){
  if(inputEditor)inputEditor.on('focus',()=>{_lastFocusedSide='in';});
  if(outputEditor)outputEditor.on('focus',()=>{_lastFocusedSide='out';});
})();

// ================================================================
//  OUTPUT ACTIONS
// ================================================================
function copyOut(){
  const v=outputEditor.getValue();if(!v)return;
  function _setCopied(){const btn=G('btn-copy');btn.textContent='Copied!';setTimeout(()=>{btn.textContent='Copy';},1400);}
  navigator.clipboard.writeText(v).then(_setCopied).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=v;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    _setCopied();
  });
}

function dlMap(){
  if(!_lastMap)return;
  const blob=new Blob([_lastMap],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(VAL('o_smap_url')||'output.js.map').split('/').pop();
  a.click();
}

// ================================================================
//  PERSISTENCE
// ================================================================
const PERSIST_KEY='obscura_clean_v1';

function saveSettings(){
  try{
    const data={v:1};
    data.inputCode=inputEditor?inputEditor.getValue():'';
    ['o_mini','o_semi','o_ignimport','o_html','o_srcmap'].forEach(id=>{
      const e=document.getElementById(id);if(e)data['ck_'+id]=e.checked;
    });
    ['o_strict_mode','o_smap_url','o_smap_root','seed-val'].forEach(id=>{
      const e=document.getElementById(id);if(e)data['tx_'+id]=e.value;
    });
    localStorage.setItem(PERSIST_KEY,JSON.stringify(data));
  }catch(e){console.warn('save failed',e);}
}

function loadSettings(){
  try{
    const raw=localStorage.getItem(PERSIST_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(!data||data.v!==1)return false;
    ['o_mini','o_semi','o_ignimport','o_html','o_srcmap'].forEach(id=>{
      if(data['ck_'+id]!==undefined){const e=document.getElementById(id);if(e)e.checked=data['ck_'+id];}
    });
    ['o_strict_mode','o_smap_url','o_smap_root','seed-val'].forEach(id=>{
      if(data['tx_'+id]!==undefined){const e=document.getElementById(id);if(e)e.value=data['tx_'+id];}
    });
    showSub('smap-sub',document.getElementById('o_srcmap')&&document.getElementById('o_srcmap').checked);
    if(document.getElementById('btn-map'))document.getElementById('btn-map').disabled=!(document.getElementById('o_srcmap')&&document.getElementById('o_srcmap').checked);
    if(data.inputCode){
      setTimeout(()=>{if(inputEditor)inputEditor.setValue(data.inputCode);},50);
    }
    return true;
  }catch(e){console.warn('load failed',e);return false;}
}

window.addEventListener('load',()=>{
  initSliders();
  setTimeout(fitEditors,80);
  loadSettings();
  document.querySelectorAll('input[id],select[id]').forEach(el=>{
    el.addEventListener('change',saveSettings);
    if(el.type==='range')el.addEventListener('input',saveSettings);
  });
  if(inputEditor){
    inputEditor.on('change',()=>{
      clearTimeout(inputEditor._st);
      inputEditor._st=setTimeout(saveSettings,800);
    });
  }
});
